# Compute plane: Restate SDK services live in their own namespace
# ("restate-apps", created by 00-namespaces.yaml), separate from the "restate"
# namespace the operator creates for the RestateCluster.
#
# A RestateDeployment is a Deployment-alike managed by the restate-operator:
# every revision gets its own ReplicaSet + Service, the operator registers each
# revision with the cluster's admin API automatically (no manual
# `restate deployments register`), and old revisions are drained — scaled down
# only once they have no in-flight invocations. Lifecycle details:
# docs/03-deploying-services.md.
#
# Cross-namespace networking is mostly handled by the operator: it stamps the
# pods with the label `allow.restate.dev/restate: "true"`, which the
# RestateCluster's egress NetworkPolicy matches in any namespace.
#
# That covers the pod IPs but not the Service ClusterIP the operator registers,
# which matters on any CNI that evaluates NetworkPolicy before Service DNAT —
# the EKS VPC CNI included. There, registration times out until
# resources/06-restate-service-cidr-egress.yaml is applied, even though these
# pods are Ready. See that file's header for the mechanism.
apiVersion: restate.dev/v1beta1
kind: RestateDeployment
metadata:
  name: service
  namespace: restate-apps
spec:
  replicas: 2
  restate:
    register:
      # the RestateCluster from 04-restate-cluster.yaml; the operator resolves
      # its admin endpoint
      cluster: restate
  selector:
    matchLabels:
      app: service
  template:
    metadata:
      labels:
        app: service
    spec:
      containers:
        - name: service
          # REPLACE_ME: the SDK service image (e.g. an ECR image built from
          # this repo's node service). Keep the port name "restate" because the
          # operator uses it for the registration URL.
          image: REPLACE_ME_SERVICE_IMAGE
          ports:
            - name: restate
              containerPort: 9080
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
