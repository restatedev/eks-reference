# gp3 StorageClass for the Restate data volumes (EKS ships only gp2 by
# default). Requires the aws-ebs-csi-driver addon.
#
# Baseline gp3 is 3000 IOPS / 125 MiB/s regardless of size. For the
# 3-node.xlarge write path that's the first knob to turn under load:
# iops can go to 16000 and throughput to 1000 (MiB/s) per volume, either here
# (affects new volumes) or per-volume via a VolumeAttributesClass.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  iops: "6000"
  throughput: "500"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
