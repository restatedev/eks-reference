# gp3 StorageClass for the Restate data volumes (EKS ships only gp2 by
# default). Requires the aws-ebs-csi-driver addon.
#
# Named "restate-gp3", not "gp3", on purpose: many clusters already carry a
# generic gp3 class, and StorageClass parameters are immutable — applying
# this over an existing one fails (kubectl and Terraform alike). A scoped
# name also keeps other workloads from adopting a class this stack owns and
# may later delete. (Cloud names its class plain "gp3" — it owns its cells
# end to end; a reference targeting shared clusters must not squat the
# generic name.)
#
# `encrypted` and `xfs` match what Restate Cloud runs on EKS (cloud also turns
# on account-wide EBS encryption-by-default, which a standalone cluster can't
# assume — so encrypt here). Unlike cloud, which leaves gp3 at its baseline
# 3000 IOPS / 125 MiB/s, this class provisions 6000 IOPS / 500 MiB/s: for the
# 3-node.xlarge-vqueues write path that's the first knob to turn under load
# (the manifest caps rocksdb writes at 1200 MiB/s, well above this class's
# 500 MiB/s — the volume, not rocksdb, is the ceiling). Regional gp3 volumes can
# go to 80000 IOPS and 2000 MiB/s when the volume size, provisioned IOPS, and
# instance support them; the older 16000/1000 limits still apply on Outposts.
# Change new-volume defaults here, or existing volumes through a
# VolumeAttributesClass.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: restate-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  iops: "6000"
  throughput: "500"
  encrypted: "true"
  csi.storage.k8s.io/fstype: xfs
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
# Deviation from cloud (which uses Delete): deleting the RestateCluster CR
# deletes the namespace the operator created, which cascades to the PVCs —
# with Delete, the CSI driver would then delete all three EBS data volumes.
# Retain means an accidental (or deliberate) cluster deletion leaves the
# volumes behind as Released PVs, to recover from or clean up explicitly.
# reclaimPolicy is copied onto each PV at provision time, so changing it here
# does NOT affect already-provisioned volumes — patch those directly:
#   kubectl patch pv <pv> -p '{"spec":{"persistentVolumeReclaimPolicy":"Retain"}}'
reclaimPolicy: Retain
